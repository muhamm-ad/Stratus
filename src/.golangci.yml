version: "2"

run:
  timeout: 5m
  relative-path-mode: gomod
  modules-download-mode: readonly
  build-tags:
    - desktop          # tags used by `wails build` / `wails dev`
    - production

linters:
  default: standard    # alternative: `none` to enable ONLY the enable list below
  enable:
    - bodyclose        # unclosed res.Body on cloud HTTP calls
    - contextcheck     # proper context propagation
    - errorlint        # comparisons via errors.Is / errors.As
    - gocritic
    - gosec            # security analysis
    - misspell
    - noctx            # HTTP requests without context
    - revive
    - unconvert
    - wrapcheck        # external SDK errors properly wrapped
  settings:
    gosec:
      excludes:
        - G104         # example: silence an overly noisy rule
    revive:
      rules:
        - name: exported
        - name: var-naming
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
  exclusions:
    generated: lax           # leniently ignore generated files
    warn-unused: true        # warn if an exclusion rule is unused
    presets:
      - common-false-positives
      - std-error-handling
    rules:
      - path: '_test\.go'    # more lenient on tests
        linters:
          - gosec
          - wrapcheck
          - errcheck
    paths:
      - build/               # artifacts generated by Wails
      - frontend/wailsjs/    # Go/JS bindings generated by Wails
      - third_party/

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - gitlab.com/mouhamm-ad/stratus   # your actual module path

issues:
  max-issues-per-linter: 0   # no cap, report everything
  max-same-issues: 0
